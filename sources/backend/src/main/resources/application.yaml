server:
  port: ${SERVER_PORT}
spring:
  profiles:
    active: ${SERVER_PROFILE}
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DATA}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASS}
    hikari:
      pool-name: ${DATABASE_DATA}
      maximum-pool-size: 40
      minimum-idle: 10
      